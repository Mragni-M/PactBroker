# Variable 'GIT_COMMIT_ID' was defined in the Variables tab
# Variable 'PACT_BROKER_BASE_URL' was defined in the Variables tab
# Variable 'PACT_BROKER_PASSWORD' was defined in the Variables tab
# Variable 'PACT_BROKER_USERNAME' was defined in the Variables tab
# Variable 'PACTICIPANT' was defined in the Variables tab
# Variable 'PROVIDER_BRANCH' was defined in the Variables tab
# Variable 'PROVIDER_BUILD_URL' was defined in the Variables tab
# Variable Group 'PactVariables' was defined in the Variables tab
jobs:
- job: Job_1
  displayName: Agent job 1
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchTags: false
  - task: Bash@3
    displayName: 'Bash Script: declare dynamic variable'
    inputs:
      targetType: inline
      script: >2-

        echo "##vso[task.setvariable variable=PROVIDER_BUILD_VERSION;]$(git rev-parse --short $BUILD_SOURCEVERSION)"


        echo "##vso[task.setvariable variable=PROVIDER_APP_VERSION;]$(git rev-parse --short $GIT_COMMIT_ID)"
  - task: Bash@3
    displayName: 'Bash Script: echo variable'
    inputs:
      targetType: inline
      script: >-
        echo 'variables'


        echo GIT_COMMIT_ID is: $GIT_COMMIT_ID

        echo PACT_BROKER_BASE_URL is: $PACT_BROKER_BASE_URL

        echo PACT_BROKER_PASSWORD is: $PACT_BROKER_PASSWORD

        echo PACT_BROKER_USERNAME: $PACT_BROKER_USERNAME

        echo PACTICIPANT: $PACTICIPANT

        echo PROVIDER_BRANCH: $PROVIDER_BRANCH

        echo PROVIDER_BUILD_URL: $PROVIDER_BUILD_URL

        echo PROVIDER_BUILD_VERSION: $PROVIDER_BUILD_VERSION

        echo PROVIDER_APP_VERSION: $PROVIDER_APP_VERSION
  - task: DotNetCoreCLI@2
    displayName: dotnet restore
    inputs:
      command: restore
  - task: DotNetCoreCLI@2
    displayName: dotnet build
  - task: DotNetCoreCLI@2
    displayName: dotnet test
    inputs:
      command: test
- job: Job_2
  displayName: Can I deploy
  dependsOn: Job_1
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchTags: false
  - task: Bash@3
    displayName: 'Bash Script: declare dynamic variable copy'
    inputs:
      targetType: inline
      script: >2-

        echo "##vso[task.setvariable variable=PROVIDER_BUILD_VERSION;]$(git rev-parse --short $BUILD_SOURCEVERSION)"


        echo "##vso[task.setvariable variable=PROVIDER_APP_VERSION;]$(git rev-parse --short $GIT_COMMIT_ID)"
  - task: Bash@3
    displayName: 'Bash Script: can I deploy'
    inputs:
      targetType: inline
      script: >
        # Write your commands here


        echo 'pact-broker can I deploy provider'


        docker run --rm  \
         -e $PACT_BROKER_BASE_URL \
         -e $PACT_BROKER_USERNAME \
         -e $PACT_BROKER_PASSWORD \
          pactfoundation/pact-cli:latest \
          pact-broker can-i-deploy \
          --pacticipant $PACTICIPANT \
          --version  $PROVIDER_APP_VERSION \
          --branch $PROVIDER_BRANCH \
          --to master \
          --broker-base-url $PACT_BROKER_BASE_URL \
          --broker-username $PACT_BROKER_USERNAME \
          --broker-password $PACT_BROKER_PASSWORD \
          --verbose true
...
