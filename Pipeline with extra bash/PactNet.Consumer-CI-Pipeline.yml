# Variable 'BUILD_URL' was defined in the Variables tab
# Variable 'CONSUMER_BRANCH' was defined in the Variables tab
# Variable 'CONSUMER_VERSION_TAG' was defined in the Variables tab
# Variable 'CONTRACT_REQUIRING_VERIFICATION_PUBLISHED_WEBHOOK_UUID' was defined in the Variables tab
# Variable 'PACT_BROKER_BASE_URL' was defined in the Variables tab
# Variable 'PACT_BROKER_PASSWORD' was defined in the Variables tab
# Variable 'PACT_BROKER_USERNAME' was defined in the Variables tab
# Variable 'PACTICIPANT' was defined in the Variables tab
# Variable 'PAT' was defined in the Variables tab
# Variable 'PROVIDER_VERIFICATION_JOB_URL' was defined in the Variables tab
# Variable Group 'ConsumerVariables' was defined in the Variables tab
trigger:
  branches:
    include:
    - refs/heads/master
jobs:
- job: Job_1
  displayName: DotNet Job
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchTags: false
  - task: Bash@3
    displayName: Bash Script
    inputs:
      targetType: inline
      script: >2-

        echo CONSUMER_APP_VERSION is : $CONSUMER_APP_VERSION


        echo CONSUMER_APP_VERSION is : $(CONSUMER_APP_VERSION)
  - task: DotNetCoreCLI@2
    displayName: dotnet restore
    inputs:
      command: restore
  - task: DotNetCoreCLI@2
    displayName: dotnet build
  - task: DotNetCoreCLI@2
    displayName: dotnet test
    inputs:
      command: test
      projects: PactNet.Consumer.Tests
  - task: CopyFiles@2
    displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
    inputs:
      SourceFolder: $(System.DefaultWorkingDirectory)/PactNet.Consumer.Tests/pacts
      TargetFolder: $(Build.ArtifactStagingDirectory)
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: pacts'
    inputs:
      ArtifactName: pacts
- job: Job_2
  displayName: Publish Pact Job
  dependsOn: Job_1
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchTags: false
  - task: DownloadBuildArtifacts@1
    displayName: Download Build Artifacts
    inputs:
      artifactName: pacts
      extractTars: false
  - task: Bash@3
    displayName: 'Bash Script: list directory'
    inputs:
      targetType: inline
      script: >+
        # Write your commands here

        echo '================System.ArtifactsDirectory=================='

        ls '$(System.ArtifactsDirectory)'

        ls '$(System.ArtifactsDirectory)/pacts'


        echo '================Build.ArtifactStagingDirectory=================='


        ls '$(Build.ArtifactStagingDirectory)'

        ls '$(Build.ArtifactStagingDirectory)/pacts'


        echo '===============PWD==================='


        echo PWD: "$PWD"

        ls "$PWD"

  - task: Bash@3
    displayName: 'Bash Script: dynamic variables'
    inputs:
      targetType: inline
      script: >+
        echo "##vso[task.setvariable variable=BUILD_SOURCE_VERSION;]$(git rev-parse --short $BUILD_SOURCEVERSION)"


        echo "##vso[task.setvariable variable=PACT_FILE_PATH;]${PWD}/pacts"


  - task: Bash@3
    displayName: 'Bash Script: echo variables'
    inputs:
      targetType: inline
      script: >-
        echo 'variables'


        echo PACT_BROKER_BASE_URL is : "$PACT_BROKER_BASE_URL"


        echo PACT_BROKER_PASSWORD is : "$PACT_BROKER_PASSWORD"


        echo PACT_BROKER_USERNAME is : "$PACT_BROKER_USERNAME"


        echo PACTICIPANT is : "$PACTICIPANT"


        echo PAT is : "$PAT"


        echo BUILD_SOURCE_VERSION is $BUILD_SOURCE_VERSION


        echo CONSUMER_APP_VERSION is : $CONSUMER_APP_VERSION


        echo CONSUMER_BRANCH is : $CONSUMER_BRANCH


        echo CONSUMER_VERSION_TAG is : $CONSUMER_VERSION_TAG


        echo PACT_FILE_PATH is : $PACT_FILE_PATH


        echo BUILD_URL is : $BUILD_URL
  - task: Bash@3
    displayName: 'Bash Script: docker run publish pact'
    inputs:
      targetType: inline
      script: >
        # Write your commands here


        echo 'publish pact '


        docker run --rm  \
         -w ${PWD} \
         -v $(Build.ArtifactStagingDirectory):${PWD} \
         -e $PACT_BROKER_BASE_URL \
         -e $PACT_BROKER_USERNAME \
         -e $PACT_BROKER_PASSWORD \
          pactfoundation/pact-cli:latest \
          publish \
          $PACT_FILE_PATH \
          --consumer-app-version $BUILD_SOURCE_VERSION \
          --branch $CONSUMER_BRANCH \
          --build-url $BUILD_URL \
          --broker-base-url $PACT_BROKER_BASE_URL \
          --broker-username $PACT_BROKER_USERNAME \
          --broker-password $PACT_BROKER_PASSWORD \


        # for connecting to Pact Broker running on localhost

        # --network="host"
- job: Job_4
  displayName: Can I deploy
  dependsOn: Job_2
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchTags: false
  - task: Bash@3
    displayName: 'Bash Script: Consumer App version'
    inputs:
      targetType: inline
      script: >-
        # Write your commands here


        echo CONSUMER_APP_VERSION is $CONSUMER_APP_VERSION


        echo "##vso[task.setvariable variable=CONSUMER_APP_VERSION;]$(git rev-parse --short $GIT_COMMIT_ID)"
  - task: Bash@3
    displayName: 'Bash Script: can-i-deploy consumer'
    inputs:
      targetType: inline
      script: >-
        # Write your commands here


        echo 'pact broker : can i deploy consumer'


        docker run --rm  \
         -e $PACT_BROKER_BASE_URL \
         -e $PACT_BROKER_USERNAME \
         -e $PACT_BROKER_PASSWORD \
          pactfoundation/pact-cli:latest \
          pact-broker can-i-deploy \
          --pacticipant $PACTICIPANT \
          --version $BUILD_SOURCE_VERSION \
          --branch $CONSUMER_BRANCH \
          --broker-base-url $PACT_BROKER_BASE_URL \
          --broker-username $PACT_BROKER_USERNAME \
          --broker-password $PACT_BROKER_PASSWORD \
          --verbose true

        #  --to-environment dev \
  - task: Bash@3
    displayName: 'Bash Script: just to fail the job'
    inputs:
      targetType: inline
      script: 'test: "test"'
- job: Job_3
  displayName: 'Sample job: excluded : just for test'
  condition: eq(variables['Build.SourceBranch'], 'XshouldneverrunX')
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchTags: false
  - task: Bash@3
    displayName: 'Bash Script: replace function'
    inputs:
      targetType: inline
      script: >2

        echo CONSUMER_BRANCH: $CONSUMER_BRANCH


        echo CONSUMER_VERSION: $CONSUMER_VERSION


        echo BUILD_URL : $BUILD_URL
  - task: Bash@3
    displayName: 'Bash Script: test local variables'
    inputs:
      targetType: inline
      script: >
        # Write your commands here


        echo '---------------------- local variable --------------------------'

        echo 'before change'

        echo local is $(local)


        echo 'after change in same task'

        echo "##vso[task.setvariable variable=local;]'local changed'"


        echo 'the change is not reflected in same task'

        echo local is $(local)
  - task: Bash@3
    displayName: 'Bash Script: test dynamic variables copy'
    inputs:
      targetType: inline
      script: >
        # Write your commands here


        echo "##vso[task.setvariable variable=CONSUMER_APP_VERSION;]$(git rev-parse --short $BUILD_SOURCEVERSION)"


        #echo "##vso[task.setvariable variable=CONSUMER_BRANCH;]$(Build.SourceBranch)"


        #echo "##vso[task.setvariable variable=CONSUMER_VERSION_TAG;]$(Build.SourceBranch)"


        echo "##vso[task.setvariable variable=CONSUMER_BRANCH_NAME;]$(Build.SourceBranchName)"


        echo "##vso[task.setvariable variable=PACT_FILE_PATH;]${PWD}/pacts"



        echo 'the change is not reflected in same task'


        echo CONSUMER_APP_VERSION: $CONSUMER_APP_VERSION
  - task: Bash@3
    displayName: 'Bash Script: echo variables'
    inputs:
      targetType: inline
      script: "# Write your commands here\n\necho '---------------------- local variable in different task --------------------------'\necho local is $(local)\n\necho '============== dynamic variables ==========='\n\necho CONSUMER_APP_VERSION: $CONSUMER_APP_VERSION\n\necho CONSUMER_BRANCH: $CONSUMER_BRANCH\n\necho CONSUMER_VERSION_TAG: $CONSUMER_VERSION_TAG\n\necho CONSUMER_BRANCH_NAME: $CONSUMER_BRANCH_NAME \n\necho PACT_FILE_PATH: $PACT_FILE_PATH\n\necho CONSUMER_VERSION : $CONSUMER_VERSION"
  - task: Bash@3
    displayName: 'Bash Script: echo variables copy'
    inputs:
      targetType: inline
      script: >-
        # Write your commands here


        test: "test"
...
